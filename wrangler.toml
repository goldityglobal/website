name = "goldity-global"
main = "worker.js"
compatibility_date = "2026-09-09"

[vars]
GECKO_API_BASE = "https://api.geckoterminal.com/api/v2"
PUBLIC_ORIGIN = "https://goldityglobal.com"
# RESEND_API_KEY and FROM_EMAIL must be set as encrypted Worker secrets.

[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "goldity-users"
database_id = "f25e8615-3458-4363-a9f8-0334eeb0d3e6"
migrations_dir = "migrations"
