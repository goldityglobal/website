# GOLDITY is deployed on BNB Smart Chain (BSC).
# BNB Chain Mainnet deployment.

name = "goldity-global"
main = "worker.js"
compatibility_date = "2026-09-09"
keep_vars = true
[vars]
GECKO_API_BASE = "https://api.geckoterminal.com/api/v2"
PUBLIC_ORIGIN = "https://goldityglobal.com"
# RESEND_API_KEY and FROM_EMAIL must be set as encrypted Worker secrets.

[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "goldity-users"
database_id = "292a42d0-6085-44da-bc0e-d420140bcca2"
migrations_dir = "migrations"

[triggers]
crons = ["*/3 * * * *"]
